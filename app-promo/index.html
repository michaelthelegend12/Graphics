const PTS=[[0,84],[40,70],[82,78],[124,50],[170,60],[218,32],[268,40],[328,10]];
function cr(pts){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
 d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}
const lineD=cr(PTS);

const capEls=CAPS.map((c,i)=>{const e=$('#cap'+i);return [e.querySelector('.eyebrow'),e.querySelector('h1'),e.querySelector('p')]});

/* ---------- refs ---------- */
const bal=$('#bal'),cpr=$('#cpr'),sdot=$('#sdot'),spent=$('#spent');

const floor=$('#floor'),glow=$('#glow'),word=$('#bigword'),intro=$('#intro'),fade=$('#fade'),sheen=$('#sheen');

const SLIDES=[6.25,10.0,13.75,17.5];

function render(t){
  /* background drift */
  $('#b1').style.transform=`translate(${Math.sin(t*.32)*140}px,${Math.cos(t*.27)*90}px)`;
  $('#b2').style.transform=`translate(${Math.cos(t*.29)*130}px,${Math.sin(t*.33)*100}px)`;

  $('#b4').style.transform=`translate(${Math.cos(t*.3+1)*120}px,${Math.sin(t*.26)*110}px)`;

  /* phone pose */
  const sh=eIO4(prog(t,2.35,3.45));
  const x=430*sh;
  const y=(1-eO4(prog(t,0,1.9)))*900+Math.sin(t*1.25)*11;
  const ry=lerp(lerp(42,-8,eO4(prog(t,0,2.3))),-17,sh)+Math.sin(t*.9)*3.6;
  const rx=7+Math.sin(t*.75+1)*2.3;
  const rz=Math.sin(t*.55)*1.2+(1-eO4(prog(t,0,2.3)))*-7;
  const sc=lerp(1.06,1,sh);
  phone.style.transform=`translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${sc})`;
  floor.style.left=(960+x-220)+'px';floor.style.top=(968+Math.sin(t*1.25)*-3)+'px';
  floor.style.opacity=eO3(prog(t,.6,2.0))*(0.9-Math.sin(t*1.25)*.08);
  floor.style.transform=`scaleX(${1-Math.sin(t*1.25)*.03})`;
  glow.style.left=(960+x*.9-500)+'px';glow.style.top='40px';
  sheen.style.backgroundPositionX=(((ry+30)/60)*100)+'%';

  /* intro wordmark */
  const wi=eO3(prog(t,.3,1.4)),wo=eIO(prog(t,2.2,3.1));
  word.style.opacity=wi*(1-wo);
  word.style.transform=`translateX(${-wo*260}px) scale(${lerp(.96,1,wi)*(1-wo*.08)})`;
  intro.style.opacity=wi*(1-wo);

  /* captions */
  CAPS.forEach((c,i)=>{[0,.09,.2].forEach((d,k)=>{
    const pin=eO4(prog(t,c.a+d,c.a+d+.75));
    const pout=c.b>90?0:eIO(prog(t,c.b-.1+d*.4,c.b+.35+d*.4));
    const o=pin*(1-pout);
    capEls[i][k].style.opacity=o;
    capEls[i][k].style.transform=`translateY(${(1-pin)*36-pout*22}px)`;
  })});

  /* screen track */
  let idx=0;SLIDES.forEach(s=>{idx+=eIO5(prog(t,s,s+.85))});
  track.style.transform=`translateX(${-idx*372}px)`;
  const dk=clamp(idx-3.2,0,.8)/.8;
  const col=`rgb(${Math.round(lerp(20,255,dk))},${Math.round(lerp(21,255,dk))},${Math.round(lerp(43,255,dk))})`;

  /* S1 balance + spark */
  const pb=eO3(prog(t,3.4,5.95));
  bal.textContent=money(24860.52*pb);
  const bp=prog(t,5.8,6.1);bal.style.transform=`scale(${1+Math.sin(bp*Math.PI)*.025})`;bal.style.transformOrigin='left center';
  const ps=eIO(prog(t,3.5,5.9));
  cpr.setAttribute('width',328*ps);
  const pt=sline.getPointAtLength(SLEN*ps);sdot.setAttribute('cx',pt.x);sdot.setAttribute('cy',pt.y);sdot.style.opacity=ps>0.01?1:0;

  /* S2 card */
  const ci=eO4(prog(t,6.7,7.7));
  const fp=eIO5(prog(t,8.0,9.25)),lift=Math.sin(fp*Math.PI);
  cardin.style.transform=`translateY(${(1-ci)*70-lift*16}px) scale(${lerp(.9,1,ci)+lift*.07}) rotateX(${Math.sin(t*1.1)*2.2+lift*-8}deg) rotateY(${180*fp+Math.sin(t*.9)*3}deg)`;
  cardin.style.opacity=ci;
  cardshadow.style.opacity=ci*(1-lift*.35);cardshadow.style.transform=`translateY(${lift*22}px) scale(${1-lift*.12})`;
  csheen.style.backgroundPositionX=(lerp(100,0,((t-7)/3.4)%1))+'%';
  const lp=eO3(prog(t,8.4,9.5));limbar.style.width=(62*lp)+'%';limused.textContent='$'+Math.round(1240*lp).toLocaleString('en-US');

  /* S3 insights */
  const sp=eO3(prog(t,10.9,11.9));spent.textContent='$'+Math.round(3214*sp).toLocaleString('en-US');
  bars.forEach((b,i)=>{const p=eO4(prog(t,10.95+i*.07,11.75+i*.07));b.style.height=(BARS[i]*150*p)+'px'});
  const tp=eBack(prog(t,11.9,12.35));tip.style.opacity=prog(t,11.9,12.1);tip.style.transform=`scale(${lerp(.4,1,tp)}) translateY(${(1-tp)*14}px)`;
  catfills.forEach((f,i)=>{const p=eO4(prog(t,11.7+i*.13,12.6+i*.13));f.style.width=(parseFloat(f.dataset.w)*p*(296/100/2.2*2.2/2.2)*1)+'px'});

  /* S4 send */
  const ap=eO3(prog(t,14.7,15.7));amt.textContent='$'+(250*ap).toFixed(2);
  ring.style.opacity=prog(t,14.3,14.6);
  const press=Math.sin(prog(t,15.9,16.1)*Math.PI)*.04;
  const mp=eIO(prog(t,16.1,16.6));
  sendbtn.style.left=(22+134*mp)+'px';sendbtn.style.width=(328-268*mp)+'px';
  sendbtn.style.transform=`scale(${1-press})`;
  sendbtn.style.background=mp>0?`linear-gradient(90deg,rgb(${Math.round(lerp(108,52,mp))},${Math.round(lerp(92,211,mp))},${Math.round(lerp(231,153,mp))}),rgb(${Math.round(lerp(232,52,mp))},${Math.round(lerp(111,211,mp))},${Math.round(lerp(176,153,mp))}))`:'linear-gradient(90deg,#6c5ce7,#a06cf2 60%,#e86fb0)';

  [ring1,ring2].forEach((r,i)=>{const p=prog(t,16.35+i*.18,17.2+i*.18);r.style.opacity=p>0&&p<1?(1-p)*.7:0;r.style.transform=`scale(${1+p*3.4})`});
  sentmsg.style.opacity=eO3(prog(t,16.6,17.0));sentmsg.style.transform=`translateY(${(1-eO3(prog(t,16.6,17.0)))*10}px)`;

  /* S5 brand */
  const bp5=eO4(prog(t,18.0,19.0));
  orb.style.opacity=bp5;orb.style.transform=`scale(${lerp(.5,1,bp5)*(1+Math.sin(t*2.2)*.03)})`;
  orbglow.style.opacity=bp5*(.8+Math.sin(t*2.2)*.2);orbglow.style.transform=`scale(${1+Math.sin(t*2.2)*.08})`;
  [[s5word,.1],[s5tag,.25],[s5btn,.45]].forEach(([e,d])=>{const p=eO4(prog(t,18.0+d,19.0+d));e.style.opacity=p;e.style.transform=`translateY(${(1-p)*24}px)`});

  /* chips */
  CH.forEach((c,i)=>{
    const el=document.getElementById('chip'+i);
    const pin=eBack(prog(t,c.a,c.a+.6)),pout=eIO(prog(t,c.b-.1,c.b+.35));
