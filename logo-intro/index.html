<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphics — Logo Intro</title>
<style>
  :root {
    --bg: #0b0d17;
    --ink: #f4f1ea;
    --a: #ff5d73;
    --b: #ffb84d;
    --c: #4dd6c1;
    --d: #6c7bff;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #151a33 0%, var(--bg) 70%);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: min(92vw, 760px);
    aspect-ratio: 16 / 10;
    display: grid;
    place-items: center;
  }

  /* ---------- Mark ---------- */
  .mark { position: absolute; width: 34%; top: 14%; left: 50%; transform: translateX(-50%); overflow: visible; }
  .play .ring {
    stroke-dasharray: 340; stroke-dashoffset: 340;
    animation: draw 1.1s var(--ease-out) .1s forwards;
  }
  .ring.r2 { animation-delay: .3s; }
  .ring.r3 { animation-delay: .5s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .core { transform-origin: 60px 60px; transform: scale(0); }
  .play .core { animation: pop .7s var(--ease-spring) .9s forwards; }
  @keyframes pop { to { transform: scale(1); } }

  .orbit { transform-origin: 60px 60px; opacity: 0; }
  .play .orbit { animation: spin 6s linear 1.2s infinite, fadein .4s 1.2s forwards; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadein { to { opacity: 1; } }

  /* ---------- Title ---------- */
  .title {
    position: absolute; bottom: 20%; left: 0; right: 0;
    display: flex; justify-content: center;
    font-size: clamp(32px, 9vw, 84px);
    font-weight: 800; letter-spacing: .04em;
    line-height: 1;
  }
  .title span {
    display: inline-block;
    opacity: 0;
    transform: translateY(70%) rotate(8deg);
    filter: blur(8px);
  }
  .play .title span {
    animation: letter .8s var(--ease-out) forwards;
    animation-delay: calc(1.1s + var(--i) * 70ms);
  }
  @keyframes letter { to { opacity: 1; transform: none; filter: blur(0); } }

  .tagline {
    position: absolute; bottom: 9%; left: 0; right: 0; text-align: center;
    font-size: clamp(11px, 1.8vw, 16px);
    letter-spacing: .5em; text-transform: uppercase;
    color: color-mix(in srgb, var(--ink) 60%, transparent);
    opacity: 0; transform: translateY(8px);
  }
  .play .tagline { animation: tag .9s ease 2.3s forwards; }
  @keyframes tag { to { opacity: 1; transform: none; } }

  /* underline sweep */
  .sweep {
    position: absolute; bottom: 17%; left: 50%; height: 3px; width: 0;
    transform: translateX(-50%);
    background: linear-gradient(90deg, var(--a), var(--b), var(--c), var(--d));
    border-radius: 2px;
  }
  .play .sweep { animation: sweep 1s var(--ease-out) 1.9s forwards; }
  @keyframes sweep { to { width: 56%; } }

  /* ---------- Particles ---------- */
  .dot {
    position: absolute; top: 31%; left: 50%;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--c);
    opacity: 0;
  }
  .play .dot { animation: burst 1.4s var(--ease-out) 1s forwards; }
  @keyframes burst {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.2); }
  }

  /* ---------- Replay ---------- */
  button {
    position: fixed; bottom: 24px; right: 24px;
    background: transparent; color: var(--ink);
    border: 1px solid color-mix(in srgb, var(--ink) 35%, transparent);
    border-radius: 999px; padding: 10px 20px;
    font: inherit; font-size: 14px; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  button:hover, button:focus-visible { background: color-mix(in srgb, var(--ink) 12%, transparent); border-color: var(--ink); outline: none; }

  @media (prefers-reduced-motion: reduce) {
    .play .ring, .play .core, .play .title span, .play .tagline, .play .sweep { animation-duration: .01s; animation-delay: 0s; }
    .play .orbit, .play .dot { animation: none; }
    .orbit { opacity: 1; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage">
    <svg class="mark" viewBox="0 0 120 120" aria-hidden="true">
      <g fill="none" stroke-width="4" stroke-linecap="round">
        <circle class="ring" cx="60" cy="60" r="54" stroke="var(--a)"/>
        <circle class="ring r2" cx="60" cy="60" r="40" stroke="var(--b)"/>
        <circle class="ring r3" cx="60" cy="60" r="26" stroke="var(--c)"/>
      </g>
      <circle class="core" cx="60" cy="60" r="12" fill="var(--d)"/>
      <g class="orbit">
        <circle cx="60" cy="6" r="5" fill="var(--a)"/>
        <circle cx="60" cy="114" r="5" fill="var(--c)"/>
      </g>
    </svg>

    <div id="dots"></div>

    <h1 class="title" aria-label="Graphics" id="title"></h1>
    <div class="sweep"></div>
    <p class="tagline">Motion · Design · Code</p>
  </main>

  <button id="replay" type="button">Replay</button>

<script>
  const stage = document.getElementById('stage');
  const title = document.getElementById('title');
  const dots = document.getElementById('dots');
  const colors = ['--a', '--b', '--c', '--d'];

  // Split the title into letters for staggered animation.
  [...'Graphics'].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch;
    s.style.setProperty('--i', i);
    s.setAttribute('aria-hidden', 'true');
    title.appendChild(s);
  });

  // Particle burst from the mark's core.
  for (let i = 0; i < 18; i++) {
    const d = document.createElement('i');
    d.className = 'dot';
    const angle = (i / 18) * Math.PI * 2;
    const dist = 90 + Math.random() * 90;
    d.style.setProperty('--x', Math.cos(angle) * dist + 'px');
    d.style.setProperty('--y', Math.sin(angle) * dist + 'px');
    d.style.background = `var(${colors[i % colors.length]})`;
    d.style.animationDelay = (1 + Math.random() * .15) + 's';
    dots.appendChild(d);
  }

  function play() {
    stage.classList.remove('play');
    void stage.offsetWidth; // restart animations
    stage.classList.add('play');
  }

  document.getElementById('replay').addEventListener('click', play);
  play();
</script>
</body>
</html>
